# Local / VPS manual only — Coolify usa o Dockerfile diretamente.
# Não use este compose no Coolify (proxy/SSL já são gerenciados pelo Coolify).

services:
  trato:
    build: .
    image: trato-barber:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DEMO_MODE: "true"
      NODE_ENV: production
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL:-}
      UAZAPI_TOKEN: ${UAZAPI_TOKEN:-}
